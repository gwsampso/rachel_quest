<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The 10 Year Path</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        background-color: #050505;
        font-family: 'Press Start 2P', cursive;
        overflow-x: hidden;
        overflow-y: auto;
        color: #fff;
        -webkit-overflow-scrolling: touch;
      }
      
      .crt-container {
        position: relative;
      }
      
      .crt-container::before {
        content: " ";
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        z-index: 1000;
        background-size: 100% 2px, 3px 100%;
        pointer-events: none;
      }

      .crt-container::after {
        content: " ";
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: rgba(18, 16, 16, 0.1);
        opacity: 0;
        z-index: 1001;
        pointer-events: none;
        animation: flicker 0.15s infinite;
      }

      @keyframes flicker {
        0% { opacity: 0.27861; }
        5% { opacity: 0.34769; }
        10% { opacity: 0.23604; }
        15% { opacity: 0.90626; }
        20% { opacity: 0.18128; }
        25% { opacity: 0.83891; }
        30% { opacity: 0.65583; }
        35% { opacity: 0.57807; }
        40% { opacity: 0.26559; }
        45% { opacity: 0.84693; }
        50% { opacity: 0.96019; }
        55% { opacity: 0.08523; }
        60% { opacity: 0.71056; }
        65% { opacity: 0.7343; }
        70% { opacity: 0.85823; }
        75% { opacity: 0.13829; }
        80% { opacity: 0.4942; }
        85% { opacity: 0.58732; }
        90% { opacity: 0.28527; }
        95% { opacity: 0.51859; }
        100% { opacity: 0.63337; }
      }

      /* Doubled Boss Encounter Strobe Duration */
      @keyframes boss-strobe {
        0% { background-color: black; opacity: 1; }
        5% { background-color: white; opacity: 1; }
        10% { background-color: black; opacity: 1; }
        15% { background-color: white; opacity: 1; }
        20% { background-color: black; opacity: 1; }
        25% { background-color: white; opacity: 1; }
        30% { background-color: black; opacity: 1; }
        35% { background-color: white; opacity: 1; }
        40% { background-color: black; opacity: 1; }
        45% { background-color: white; opacity: 1; }
        50% { background-color: black; opacity: 1; }
        55% { background-color: white; opacity: 1; }
        60% { background-color: black; opacity: 1; }
        65% { background-color: white; opacity: 1; }
        70% { background-color: black; opacity: 1; }
        75% { background-color: white; opacity: 1; }
        80% { background-color: black; opacity: 1; }
        85% { background-color: white; opacity: 1; }
        90% { background-color: black; opacity: 1; }
        95% { background-color: white; opacity: 1; }
        100% { background-color: black; opacity: 1; }
      }

      /* Lengthened Checkerboard Fade */
      @keyframes checkerboard-in {
        0% { transform: scale(0); opacity: 0; }
        100% { transform: scale(1.5); opacity: 1; }
      }

      .animate-boss-encounter {
        animation: boss-strobe 1.6s steps(1) forwards;
      }

      .checkerboard-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 10000;
        display: grid;
        grid-template-columns: repeat(15, 1fr);
        grid-template-rows: repeat(15, 1fr);
        pointer-events: none;
      }

      .checker-square {
        background: black;
        opacity: 0;
      }

      .animate-checker {
        animation: checkerboard-in 0.8s forwards;
      }

      /* Cinematic Blackout for Time Skips */
      @keyframes cinematic-blackout {
        0% { opacity: 0; background-color: black; }
        30% { opacity: 1; background-color: black; }
        70% { opacity: 1; background-color: black; }
        100% { opacity: 0; background-color: black; }
      }

      /* Slow Reveal for The Question */
      @keyframes reveal-scene {
        0% { opacity: 1; background-color: black; }
        100% { opacity: 0; background-color: black; }
      }

      .flash-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 9999;
        pointer-events: none;
        opacity: 0;
      }

      .animate-flash {
        animation: cinematic-blackout 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      .animate-reveal-slow {
        animation: reveal-scene 4s ease-in-out forwards;
        z-index: 10002;
        pointer-events: none;
      }

      * {
        cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><rect x="0" y="0" width="4" height="4" fill="white"/><rect x="4" y="4" width="4" height="4" fill="white"/><rect x="8" y="8" width="4" height="4" fill="white"/><rect x="0" y="0" width="2" height="2" fill="black"/><rect x="4" y="4" width="2" height="2" fill="black"/><rect x="8" y="8" width="2" height="2" fill="black"/></svg>'), auto;
      }
    </style>
</head>
  <body class="crt-container">
    <div id="root"></div>
    <div class="scanline"></div>
    <div id="flash-overlay" class="flash-overlay"></div>
    <div id="boss-overlay" class="flash-overlay"></div>
    <div id="checker-container" class="checkerboard-overlay"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
